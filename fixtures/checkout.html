<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bandersnatch Checkout Fixture</title>
  <style>
    body{margin:0;background:#f4f2eb;color:#18201c;font:16px system-ui,sans-serif}main{max-width:560px;margin:60px auto;padding:28px;background:white;border:1px solid #d7dbd7;border-radius:20px}
    header{display:flex;justify-content:space-between;align-items:center}button,input{font:inherit;border-radius:9px;padding:10px 12px}button{border:0;background:#176b4d;color:white;font-weight:700}input{border:1px solid #cdd3ce}
    #cart{margin-top:24px;border-top:1px solid #e2e5e2;padding-top:20px}.row{display:flex;gap:9px}.totals{margin-top:24px;font-size:20px}.muted{color:#6b746f}.notice{color:#176b4d;font-weight:700}
  </style>
</head>
<body>
<main data-testid="checkout">
  <header><div><strong>Bandersnatch Shop</strong><div class="muted">Controlled test surface</div></div><button data-testid="open-cart">Cart · 1</button></header>
  <section id="cart" data-testid="cart" hidden>
    <h1>Your cart</h1><p>Everyday backpack</p>
    <div class="row"><label>Coupon <input data-testid="coupon-input" aria-label="Coupon code"></label><button data-testid="apply-coupon">Apply</button></div>
    <p class="notice" data-testid="coupon-status" aria-live="polite"></p>
    <div class="totals" data-testid="total">Total: <strong>₹1,999</strong></div>
  </section>
</main>
<script>
  const mode=new URLSearchParams(location.search).get("mode")||"success";
  const cart=document.querySelector('[data-testid="cart"]');
  const status=document.querySelector('[data-testid="coupon-status"]');
  const total=document.querySelector('[data-testid="total"]');
  document.querySelector('[data-testid="open-cart"]').onclick=()=>cart.hidden=false;
  document.querySelector('[data-testid="apply-coupon"]').onclick=()=>{
    const code=document.querySelector('[data-testid="coupon-input"]').value.trim().toUpperCase();
    if(code!=="SAVE10"){status.textContent="Coupon not recognised";return}
    status.textContent="Coupon SAVE10 applied";
    if(mode==="success")total.innerHTML="Total: <strong>₹1,799</strong>";
    if(mode==="missing")total.remove();
  };
</script>
</body>
</html>
